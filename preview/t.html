<!DOCTYPE html>
<html>
<head>
  <title>Event Capturing and Bubbling with stopPropagation</title>
  <style>
    .outer {
      padding: 30px;
      background-color: #f2f2f2;
    }
    .middle {
      padding: 20px;
      background-color: #c2e7ff;
    }
    .inner {
      padding: 10px;
      background-color: #a0ffb2;
    }
  </style>
</head>
<body>
  <div class="outer">
    Outer
    <div class="middle">
      Middle
      <button class="inner">Click Me</button>
    </div>
  </div>

  <script>
    const outer = document.querySelector('.outer');
    const middle = document.querySelector('.middle');
    const inner = document.querySelector('.inner');

    // Capturing
    outer.addEventListener('click', e => console.log('Outer - Capturing'), true);
    middle.addEventListener('click', e => console.log('Middle - Capturing'), true);
    inner.addEventListener('click', e => {
      console.log('Inner - Capturing (stopped)');
      e.stopPropagation(); // Try commenting this out to see the full flow
    }, true);

    // Bubbling
    outer.addEventListener('click', e => console.log('Outer - Bubbling'));
    middle.addEventListener('click', e => console.log('Middle - Bubbling'));
    inner.addEventListener('click', e => {
      console.log('Inner - Bubbling');
      e.stopPropagation(); // Uncomment to stop bubbling
    });
  </script>
</body>
</html>
