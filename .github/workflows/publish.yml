
name: Publish package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory under packages/"
        required: true
        default: "ziko"
        type: string
      tag:
        description: "npm dist-tag"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - next
          - beta

  push:
    tags:
      - "ziko-v*"
      - "create-ziko-v*"
      - "jsx-v*"
      - "html-v*"
      - "vite-plugin-jsx-v*"
      - "vite-plugin-html-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event_name == 'push' && github.ref_name || inputs.package }}
  cancel-in-progress: false

jobs:
  publish:
    name: Stage package on npm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Setup npm CLI
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine package and dist-tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$REF_NAME" =~ ^ziko-v(.+)$ ]]; then
              PACKAGE="ziko"
              VERSION="${BASH_REMATCH[1]}"
            elif [[ "$REF_NAME" =~ ^console-v(.+)$ ]]; then
              PACKAGE="console"
              VERSION="${BASH_REMATCH[1]}"
            elif [[ "$REF_NAME" =~ ^notebook-v(.+)$ ]]; then
              PACKAGE="notebook"
              VERSION="${BASH_REMATCH[1]}"
            else
              echo "::error::Unsupported release tag: $REF_NAME"
              exit 1
            fi

            if [[ "$VERSION" == *-* ]]; then
              TAG="beta"
            else
              TAG="latest"
            fi
          else
            PACKAGE="$INPUT_PACKAGE"
            TAG="${INPUT_TAG:-latest}"
          fi

          # Only allow known package directories.
          case "$PACKAGE" in
            ziko|console|notebook) ;;
            *)
              echo "::error::Unsupported package: $PACKAGE"
              exit 1
              ;;
          esac

          if [[ ! -f "packages/$PACKAGE/package.json" ]]; then
            echo "::error::Missing packages/$PACKAGE/package.json"
            exit 1
          fi

          case "$TAG" in
            latest|next|beta) ;;
            *)
              echo "::error::Unsupported npm dist-tag: $TAG"
              exit 1
              ;;
          esac

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION:-}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Package: $PACKAGE"
          echo "Dist-tag: $TAG"

      - name: Check release version
        if: github.event_name == 'push'
        working-directory: packages/${{ steps.release.outputs.package }}
        shell: bash
        env:
          TAG_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Git tag version ($TAG_VERSION) does not match package version ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Preview package contents
        working-directory: packages/${{ steps.release.outputs.package }}
        run: npm pack --dry-run

      - name: Stage package on npm
        working-directory: packages/${{ steps.release.outputs.package }}
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.tag }}
        run: npm stage publish --tag "$NPM_DIST_TAG"
