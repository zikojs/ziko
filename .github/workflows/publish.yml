
name: Publish ziko

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (latest, next, beta, ...)"
        required: false
        default: "latest"
        type: string
  push:
    tags:
      - "ziko-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine npm dist-tag
        id: dist-tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG:-latest}"
          elif [[ "$REF_NAME" == *-* ]]; then
            TAG="beta"
          else
            TAG="latest"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        working-directory: packages/ziko
        run: pnpm publish --provenance --access public --no-git-checks --tag "${{ steps.dist-tag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
